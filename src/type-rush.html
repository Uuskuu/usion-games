<!DOCTYPE html>
<html data-game="type-rush">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!--SDK-->
<title>Хурдан бичээч · Type Rush</title>
<style>/*SHARED_CSS*/
.text{-webkit-user-select:text;user-select:text;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:clamp(18px,5vw,24px);line-height:1.6;min-height:120px;letter-spacing:.2px;word-break:break-word}
.text span{border-radius:3px}
.text .ok{color:#86efac}
.text .bad{color:#fca5a5;background:rgba(239,68,68,.25);text-decoration:underline}
.text .cur{background:rgba(96,165,250,.35);box-shadow:0 2px 0 var(--blue)}
.text .todo{color:var(--muted)}
.inp{width:100%;margin-top:12px;background:var(--card2);border:2px solid var(--line);color:var(--fg);border-radius:14px;padding:14px;font-size:18px;outline:none}
.inp:focus{border-color:var(--blue)}
.inp.err{border-color:var(--bad);animation:shake .2s}
.timerbar{width:100%;height:8px;background:var(--card);border-radius:999px;overflow:hidden;margin:12px 0 6px}
.timerbar i{display:block;height:100%;background:var(--fg);transition:width .25s linear}
.prog{color:var(--muted);font-size:13px;align-self:flex-end}
.author{color:var(--muted);font-size:13px;margin-top:6px;align-self:flex-end;font-style:italic}
</style>
</head>
<body>
<div class="topbar"><h1 data-i18n="title"></h1><button id="setBtn" class="tb">⚙</button><button id="sfxBtn" class="tb"></button><button id="langBtn" class="tb"></button></div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="l">WPM</div><div class="v" id="wpm">0</div></div>
    <div class="stat"><div class="l" data-i18n="acc"></div><div class="v" id="acc">100%</div></div>
    <div class="stat"><div class="l" data-i18n="time"></div><div class="v" id="time">0:00</div></div>
  </div>
  <div class="timerbar"><i id="tbar" style="width:100%"></i></div>
  <div class="prog" id="prog"></div>
  <div class="text" id="text"></div>
  <div class="author" id="author"></div>
  <input class="inp" id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-ph="ph">
</div>


<div class="overlay" id="menuOv" hidden>
  <div class="panel">
    <h2 data-i18n="title"></h2>
    <p data-i18n="rules"></p>
    <div class="muted" data-i18n="lvl"></div>
    <div class="chips" id="lvlChips">
      <button class="chip on" data-lvl="1" data-i18n="l1"></button>
      <button class="chip" data-lvl="2" data-i18n="l2"></button>
      <button class="chip" data-lvl="3" data-i18n="l3"></button>
    </div>
    <div class="muted" data-i18n="textLang"></div>
    <div class="chips" id="tlChips">
      <button class="chip on" data-tl="mn">Монгол</button>
      <button class="chip" data-tl="en">English</button>
    </div>
    <button class="btn" id="menuStart" data-i18n="start"></button>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="panel">
    <h2 id="endTitle"></h2>
    <div class="big" id="finalScore">0</div>
    <p id="endMsg"></p>
    <div class="lb" id="lb"></div>
    <div class="row"><button class="btn" id="againBtn" data-i18n="again"></button><button class="btn sec" id="menuBtn2" data-i18n="settings"></button></div>
  </div>
</div>

<script>/*SHARED_JS*/</script>
<script>
I18N.register({
  mn:{title:'Хурдан бичээч',acc:'Нарийвчлал',time:'Цаг',start:'Эхлэх',again:'Дахин',settings:'Тохиргоо',ph:'Энд бич...',
      rules:'Дэлгэц дээрх өгүүлбэрийг аль болох хурдан, зөв бич. Үг бүрийн дараа зай (space) дар. 5 өгүүлбэр, цаг хязгаартай.',
      lvl:'Түвшин',l1:'Хялбар (90с)',l2:'Дунд (75с)',l3:'Хүнд (60с)',textLang:'Текстийн хэл',
      done:'Дууслаа! 🏁',timeUp:'Цаг дууслаа ⏱',
      result:'{w} WPM · {a}% нарийвчлал · {n}/{t} өгүүлбэр',newBest:'🎉 Шинэ дээд амжилт!',
      shareText:'Хурдан бичээч: {s} оноо, {w} WPM! Чи хурдан уу? ⌨️⚡',sent:'Өгүүлбэр {i}/{t}',score:'оноо'},
  en:{title:'Type Rush',acc:'Accuracy',time:'Time',start:'Start',again:'Play again',settings:'Settings',ph:'Type here...',
      rules:'Type the sentence as fast and accurately as you can. Press space after each word. 5 sentences, limited time.',
      lvl:'Level',l1:'Easy (90s)',l2:'Medium (75s)',l3:'Hard (60s)',textLang:'Text language',
      done:'Finished! 🏁',timeUp:"Time's up ⏱",
      result:'{w} WPM · {a}% accuracy · {n}/{t} sentences',newBest:'🎉 New best score!',
      shareText:'Type Rush: {s} points, {w} WPM! Are you faster? ⌨️⚡',sent:'Sentence {i}/{t}',score:'points'}
});
// [text, source]
const TEXTS={
  mn:{1:[
    ['Эх орон минь миний хайр.','—'],['Ном бол мэдлэгийн түлхүүр.','—'],['Хүн ахтай, дээл захтай.','Зүйр үг'],['Усыг нь уувал ёсыг нь дага.','Зүйр үг'],['Эрдэм номтой хүн эрхэм.','Зүйр үг'],['Сайн хүн санаанаас.','Зүйр үг'],['Хөдөлмөр хүнийг сайхан болгодог.','—'],['Өнөөдөр тэнгэр цэлмэг байна.','—']],
    2:[
    ['Хүний муу бол хэлэхээр, өөрийн муу бол нуухаар.','Зүйр үг'],['Урт хоолой урагшаа, ухаантай хүн өөдөө.','Зүйр үг'],['Ажил хийвэл дуустал, давс хийвэл уустал.','Зүйр үг'],['Эр хүн зорьсондоо, эмэгтэй хүн эрхэлсэндээ.','Зүйр үг'],['Хэлсэн үг хэлээгүй үгнээс хүнд.','Зүйр үг'],['Мянган удаа сонсохоор нэг удаа харсан нь дээр.','Зүйр үг'],['Нохой хуцахаараа, хүн ярихаараа.','Зүйр үг'],['Хичээвэл хүн болно, хичээхгүй бол хүн болохгүй.','Зүйр үг']],
    3:[
    ['Эрдэмтэй хүн даруу, эрдэмгүй хүн ихэмсэг байдаг гэдгийг эртний мэргэд хэлсэн юм.','Мэргэн үг'],['Тэнгэрийн заяа, газрын хишиг гэдэг нь хөдөлмөрлөсөн хүнд л ирдэг гэж өвгөд хэлдэг.','Мэргэн үг'],['Өөрийгөө ялсан хүн мянган дайсныг ялснаас илүү хүчирхэг.','Мэргэн үг'],['Хуучин ном бүр шинэ уншигчдаа шинэ юм хэлдэг, шинэ уншигч бүр хуучин номоо шинээр нээдэг.','—'],['Уулын өндөрт бус, ухааны өндөрт хүрэхийг зорь.','Мэргэн үг'],['Сайн санаа сарнай цэцэг мэт хүнийг тойрон ургаж, муу санаа өргөст бут мэт өөрийгөө хатгадаг.','—']]},
  en:{1:[
    ['Practice makes perfect.','Proverb'],['Time is money.','Proverb'],['Knowledge is power.','Francis Bacon'],['Stay hungry, stay foolish.','Steve Jobs'],['Less is more.','—'],['The sky is clear today.','—'],['Actions speak louder than words.','Proverb'],['Every day is a new start.','—']],
    2:[
    ['A journey of a thousand miles begins with a single step.','Lao Tzu'],['The only way to do great work is to love what you do.','Steve Jobs'],['Simplicity is the ultimate sophistication.','Leonardo da Vinci'],['Do not wait; the time will never be just right.','Napoleon Hill'],['Well done is better than well said.','Benjamin Franklin'],['Talk is cheap. Show me the code.','Linus Torvalds'],['The best way to predict the future is to invent it.','Alan Kay'],['Fall seven times and stand up eight.','Japanese proverb']],
    3:[
    ['Any sufficiently advanced technology is indistinguishable from magic.','Arthur C. Clarke'],['Programs must be written for people to read, and only incidentally for machines to execute.','Harold Abelson'],['It always seems impossible until it is done; then it seems like it was always inevitable.','—'],['The measure of intelligence is the ability to change when the world around you changes.','—'],['First, solve the problem. Then, write the code; premature optimization is the root of all evil.','John Johnson / Donald Knuth'],['Whether you think you can or you think you cannot, you are usually right.','Henry Ford']]}
};
const LIMITS={1:90,2:75,3:60},SENTS=5;
let lvl=1,tl='mn',queue=[],idx=0,target='',typedChars=0,correctChars=0,errors=0,startT=0,timer=null,running=false,timeLeft=0,score=0,finished=0;
const inp=$('#inp');

function render(){
  const val=inp.value;const el=$('#text');let html='';
  for(let i=0;i<target.length;i++){
    const ch=target[i];let cls='todo';
    if(i<val.length)cls=val[i]===ch?'ok':'bad';else if(i===val.length)cls='cur';
    html+='<span class="'+cls+'">'+(ch===' '?'&nbsp;':ch.replace(/</g,'&lt;'))+'</span>';
  }
  el.innerHTML=html;
}
function load(){
  const [t,a]=queue[idx];target=t;$('#author').textContent=a&&a!=='—'?'— '+a:'';inp.value='';render();
  $('#prog').textContent=I18N.t('sent',{i:idx+1,t:SENTS});
}
function stats(){
  const el=(performance.now()-startT)/60000;
  const wpm=el>0?Math.round((correctChars/5)/el):0;
  const acc=typedChars?Math.max(0,Math.round((typedChars-errors)/typedChars*100)):100;
  $('#wpm').textContent=wpm;$('#acc').textContent=acc+'%';return {wpm,acc};
}
inp.addEventListener('input',()=>{
  if(!running)return;
  const v=inp.value;
  const i=v.length-1;
  if(i>=0&&(inp._last||'').length<v.length){typedChars++;if(v[i]!==target[i]){errors++;inp.classList.remove('err');void inp.offsetWidth;inp.classList.add('err');Sfx.bad();haptic(30);}else{correctChars++;}}
  inp._last=v;render();stats();
  if(v===target){finished++;score+=Math.round(target.length*(1+Math.max(0,timeLeft)/LIMITS[lvl]));Sfx.ok();haptic(10);idx++;if(idx>=SENTS)end(true);else load();}
});
function start(){
  const pool=shuffle(TEXTS[tl][lvl].slice());queue=pool.slice(0,SENTS);idx=0;typedChars=0;correctChars=0;errors=0;score=0;finished=0;
  timeLeft=LIMITS[lvl];running=true;$('#menuOv').hidden=true;$('#endOv').hidden=true;inp._last='';
  load();startT=performance.now();inp.focus();
  clearInterval(timer);let last=performance.now();
  timer=setInterval(()=>{const n=performance.now();timeLeft-=(n-last)/1000;last=n;$('#time').textContent=fmtTime(timeLeft);$('#tbar').style.width=Math.max(0,timeLeft/LIMITS[lvl]*100)+'%';if(timeLeft<=0)end(false);},200);
}
async function end(done){
  clearInterval(timer);running=false;inp.blur();
  const {wpm,acc}=stats();
  const isBest=score>best;if(isBest){best=score;Store.set('best',best);}
  $('#endTitle').textContent=done?I18N.t('done'):I18N.t('timeUp');
  $('#finalScore').textContent=score;
  $('#endMsg').textContent=(isBest&&score>0?I18N.t('newBest')+' ':'')+I18N.t('result',{w:wpm,a:acc,n:finished,t:SENTS});
  $('#endOv').hidden=false;Sfx.win();
  await Board.submit(score,{wpm,accuracy:acc,lvl,textLang:tl,sentences:finished});
  Board.render($('#lb'));
}
$('#lvlChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('#lvlChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');lvl=+c.dataset.lvl;Store.set('lvl',lvl);};
$('#tlChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('#tlChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');tl=c.dataset.tl;Store.set('tl',tl);};
function openMenu(){clearInterval(timer);running=false;$('#endOv').hidden=true;$('#menuOv').hidden=false;}
$('#menuStart').onclick=start;$('#againBtn').onclick=start;$('#setBtn').onclick=openMenu;$('#menuBtn2').onclick=openMenu;
let best=0;
bootApp(async ()=>{
  best=(await Store.get('best'))||0;
  const l=await Store.get('lvl');if(l&&LIMITS[l]){lvl=+l;$$('#lvlChips .chip').forEach(c=>c.classList.toggle('on',+c.dataset.lvl===lvl));}
  const t=await Store.get('tl');tl=(t==='en'||t==='mn')?t:I18N.lang;$$('#tlChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.tl===tl));
  start();
});
</script>
</body>
</html>
