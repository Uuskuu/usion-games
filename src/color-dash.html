<!DOCTYPE html>
<html data-game="color-dash">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Өнгө хурд · Color Dash</title>
<!--SDK-->
<style>/*SHARED_CSS*/
.word{font-size:clamp(42px,13vw,68px);font-weight:900;text-align:center;margin:10px 0 4px;min-height:84px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.hint{color:var(--muted);font-size:14px;text-align:center;min-height:20px;font-weight:600}
.timerbar{width:100%;height:8px;background:var(--card);border-radius:999px;overflow:hidden;margin:8px 0}
.timerbar i{display:block;height:100%;background:var(--fg);transition:width .2s linear}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px;flex:1;min-height:0;align-content:start}
.tile{height:clamp(80px,21vw,116px);border-radius:16px;border:0;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22)}
.tile:active{transform:scale(.96)}
.ready{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<div class="topbar"><h1 data-i18n="title"></h1><button id="modeBtn" class="tb"></button><button id="sfxBtn" class="tb"></button><button id="langBtn" class="tb"></button></div>
<div class="wrap play">
  <div class="stats">
    <div class="stat"><div class="l" data-i18n="score"></div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="l" data-i18n="combo"></div><div class="v" id="combo">×1</div></div>
    <div class="stat"><div class="l" data-i18n="best"></div><div class="v" id="best">0</div></div>
  </div>
  <div class="timerbar"><i id="tbar" style="width:100%"></i></div>
  <div class="hint" id="hint"></div>
  <div class="word" id="word"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="menuOv" hidden>
  <div class="panel">
    <h2 data-i18n="title"></h2>
    <p data-i18n="rules"></p>
    <div class="chips" id="modeChips">
      <button class="chip on" data-mode="classic" data-i18n="modeClassic"></button>
      <button class="chip" data-mode="reverse" data-i18n="modeReverse"></button>
      <button class="chip" data-mode="chaos" data-i18n="modeChaos"></button>
    </div>
    <button class="btn" id="menuStart" data-i18n="start"></button>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="panel">
    <h2 data-i18n="timeUp"></h2>
    <div class="big" id="finalScore">0</div>
    <p id="endMsg"></p>
    <div class="lb" id="lb"></div>
    <div class="row"><button class="btn" id="againBtn" data-i18n="again"></button><button class="btn sec" id="menuBtn2" data-i18n="modes"></button></div>
  </div>
</div>

<script>/*SHARED_JS*/</script>
<script>
I18N.register({
  mn:{title:'Өнгө хурд',score:'Оноо',combo:'Комбо',best:'Дээд',start:'Эхлэх',again:'Дахин',modes:'Горим',timeUp:'Цаг дууслаа!',
      rules:'Үгийг БИШ, үсгийн ӨНГИЙГ дар! 60 секунд. Дараалан зөв дарвал комбо өснө, алдвал комбо тасарч 2 секунд хасагдана.',
      modeClassic:'Классик',modeReverse:'Урвуу',modeChaos:'Хаос',
      hintClassic:'Үсгийн ӨНГИЙГ дар',hintReverse:'Бичсэн ҮГИЙГ дар',hintChaosA:'⬛ ӨНГИЙГ дар',hintChaosB:'🔤 ҮГИЙГ дар',
      newBest:'🎉 Шинэ дээд амжилт!',accuracy:'Нарийвчлал {a}% · Хамгийн урт комбо {c}',
      red:'УЛААН',blue:'ЦЭНХЭР',green:'НОГООН',yellow:'ШАР',purple:'ЯГААН',orange:'УЛБАР'},
  en:{title:'Color Dash',score:'Score',combo:'Combo',best:'Best',start:'Start',again:'Play again',modes:'Modes',timeUp:"Time's up!",
      rules:'Tap the COLOR of the letters, NOT the word! 60 seconds. Consecutive hits build a combo; a miss resets it and costs 2 seconds.',
      modeClassic:'Classic',modeReverse:'Reverse',modeChaos:'Chaos',
      hintClassic:'Tap the ink COLOR',hintReverse:'Tap the WORD',hintChaosA:'⬛ Tap the COLOR',hintChaosB:'🔤 Tap the WORD',
      newBest:'🎉 New best score!',accuracy:'Accuracy {a}% · Longest combo {c}',
      red:'RED',blue:'BLUE',green:'GREEN',yellow:'YELLOW',purple:'PURPLE',orange:'ORANGE'}
});
const COLORS={red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#facc15',purple:'#a855f7',orange:'#f97316'};
const KEYS=Object.keys(COLORS),DUR=60;
let mode='classic',score=0,combo=0,maxCombo=0,hits=0,misses=0,timeLeft=DUR,timer=null,cur=null,running=false,askWord=false,roundStart=0,best=0;

function newRound(){
  const opts=shuffle(KEYS.slice()).slice(0,4);
  const wordKey=opts[rnd(4)];let inkKey=opts[rnd(4)];
  if(Math.random()<.75){const o=opts.filter(k=>k!==wordKey);inkKey=o[rnd(o.length)];}
  askWord = mode==='reverse' ? true : mode==='chaos' ? Math.random()<.5 : false;
  cur={wordKey,inkKey,opts,answer:askWord?wordKey:inkKey};
  const w=$('#word');w.textContent=I18N.t(wordKey);w.style.color=COLORS[inkKey];w.classList.remove('pop');void w.offsetWidth;w.classList.add('pop');
  const h=$('#hint');h.textContent=mode==='classic'?I18N.t('hintClassic'):mode==='reverse'?I18N.t('hintReverse'):(askWord?I18N.t('hintChaosB'):I18N.t('hintChaosA'));
  h.style.color=mode==='chaos'?(askWord?'#facc15':'#60a5fa'):'';
  const g=$('#grid');g.innerHTML='';
  opts.forEach(k=>{const b=document.createElement('button');b.className='tile';b.style.background=COLORS[k];b.setAttribute('aria-label',I18N.t(k));b.onpointerdown=e=>{e.preventDefault();pick(k);};g.appendChild(b);});
  roundStart=performance.now();
}
function pick(k){
  if(!running)return;
  if(k===cur.answer){
    const rt=performance.now()-roundStart;combo++;maxCombo=Math.max(maxCombo,combo);hits++;
    const mult=Math.min(5,1+Math.floor(combo/5));const bonus=rt<600?5:rt<1000?3:rt<1500?1:0;
    score+=(10+bonus)*mult;$('#combo').textContent='×'+mult;Sfx.ok();haptic(10);
    if(combo%5===0)toast('🔥 '+combo);
  }else{
    combo=0;misses++;score=Math.max(0,score-5);timeLeft=Math.max(0,timeLeft-2);
    $('#combo').textContent='×1';Sfx.bad();haptic(40);$('#word').classList.add('shake');setTimeout(()=>$('#word').classList.remove('shake'),260);
  }
  $('#score').textContent=score;newRound();
}
function start(){
  score=0;combo=0;maxCombo=0;hits=0;misses=0;timeLeft=DUR;running=true;
  $('#score').textContent=0;$('#combo').textContent='×1';$('#menuOv').hidden=true;$('#endOv').hidden=true;
  $('#modeBtn').textContent=I18N.t(mode==='classic'?'modeClassic':mode==='reverse'?'modeReverse':'modeChaos');
  newRound();let last=performance.now();clearInterval(timer);
  timer=setInterval(()=>{const n=performance.now();timeLeft-=(n-last)/1000;last=n;$('#tbar').style.width=Math.max(0,timeLeft/DUR*100)+'%';if(timeLeft<=10&&timeLeft>0&&Math.floor(timeLeft)!==Math.floor(timeLeft+0.1))Sfx.tick();if(timeLeft<=0)end();},100);
}
async function end(){
  clearInterval(timer);running=false;$('#tbar').style.width='0%';
  const acc=hits+misses?Math.round(hits/(hits+misses)*100):0;
  const isBest=score>best;if(isBest){best=score;$('#best').textContent=best;Store.set('best',best);}
  $('#finalScore').textContent=score;
  $('#endMsg').textContent=(isBest&&score>0?I18N.t('newBest')+' ':'')+I18N.t('accuracy',{a:acc,c:maxCombo});
  $('#endOv').hidden=false;Sfx.win();
  const r=await Board.submit(score,{mode,accuracy:acc,maxCombo});
  if(r&&typeof r.best==='number'&&r.best>best){best=r.best;$('#best').textContent=best;Store.set('best',best);}
  Board.render($('#lb'));
}
$('#modeChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('#modeChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');mode=c.dataset.mode;Store.set('mode',mode);};
$('#menuStart').onclick=start;$('#againBtn').onclick=start;
function openMenu(){clearInterval(timer);running=false;$('#endOv').hidden=true;$('#menuOv').hidden=false;}
$('#modeBtn').onclick=openMenu;$('#menuBtn2').onclick=openMenu;
window.addEventListener('langchange',()=>{if(cur&&running)$('#word').textContent=I18N.t(cur.wordKey);$('#modeBtn').textContent=I18N.t(mode==='classic'?'modeClassic':mode==='reverse'?'modeReverse':'modeChaos');});

bootApp(async ()=>{
  best=(await Store.get('best'))||0;$('#best').textContent=best;
  const m=await Store.get('mode');if(m&&['classic','reverse','chaos'].includes(m)){mode=m;$$('#modeChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.mode===mode));}
  start(); // single mode: play instantly, zero taps
});
</script>
</body>
</html>
