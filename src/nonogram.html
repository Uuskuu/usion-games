<!DOCTYPE html>
<html data-game="nonogram">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="usion:leaderboard" content="asc">
<!--SDK-->
<title>Зурган логик · Nonogram</title>
<style>/*SHARED_CSS*/
.board{display:grid;gap:0;margin-top:6px;touch-action:none}
.cell{background:var(--card2);border:1px solid var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800;cursor:pointer;position:relative}
.cell.on{background:var(--fg)}
.cell.x::after{content:'×';color:var(--muted);font-size:70%}
.cell.g5{border-right:2px solid var(--muted)}
.cell.g5b{border-bottom:2px solid var(--muted)}
.clue{display:flex;align-items:flex-end;justify-content:flex-end;color:var(--fg);font-weight:800;line-height:1;padding:2px}
.clue.col{flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.clue.row{flex-direction:row;gap:6px;padding-right:6px}
.clue.done{color:#4ade80}
.clue.err{color:#f87171}
.tools{display:flex;gap:8px;margin-top:14px;width:100%}
.tools .tb{flex:1;padding:12px;font-size:15px;border-radius:12px}
.tools .tb.on{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
.hidden{display:none}
</style>
</head>
<body>
<div class="topbar"><h1 data-i18n="title"></h1><button id="sizeBtn" class="tb">5×5</button><button id="sfxBtn" class="tb"></button><button id="langBtn" class="tb"></button></div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="l" data-i18n="time"></div><div class="v" id="time">0:00</div></div>
    <div class="stat"><div class="l" data-i18n="size"></div><div class="v" id="sizeV">5×5</div></div>
    <div class="stat"><div class="l" data-i18n="mistakes"></div><div class="v" id="mist">0</div></div>
  </div>
  <div class="board play" id="board"></div>
  <div class="tools">
    <button class="tb on" id="fillBtn">■ <span data-i18n="fill"></span></button>
    <button class="tb" id="xBtn">× <span data-i18n="mark"></span></button>
    <button class="tb" id="hintBtn">💡 <span data-i18n="hint"></span> (<span id="hintsLeft">3</span>)</button>
  </div>
  <p class="muted" data-i18n="tip" style="text-align:center"></p>
</div>


<div class="overlay" id="menuOv" hidden>
  <div class="panel">
    <h2 data-i18n="title"></h2>
    <p data-i18n="rules"></p>
    <div class="chips" id="sizeChips">
      <button class="chip on" data-n="5">5×5</button>
      <button class="chip" data-n="7">7×7</button>
      <button class="chip" data-n="10">10×10</button>
    </div>
    <button class="btn" id="menuStart" data-i18n="start"></button>
  </div>
</div>
<div class="overlay" id="endOv" hidden>
  <div class="panel">
    <h2 data-i18n="solved"></h2>
    <div id="preview" style="display:inline-grid;gap:1px;margin:6px auto 10px"></div>
    <div class="big" id="finalScore">0</div>
    <p id="endMsg"></p>
    <div class="lb" id="lb"></div>
    <div class="row"><button class="btn" id="againBtn" data-i18n="next"></button><button class="btn sec" id="menuBtn" data-i18n="menu"></button></div>
  </div>
</div>

<script>/*SHARED_JS*/</script>
<script>
I18N.register({
  mn:{title:'Зурган логик',time:'Цаг',size:'Хэмжээ',mistakes:'Алдаа',fill:'Будах',mark:'Тэмдэг',hint:'Зөвлөмж',start:'Эхлэх',next:'Дараагийн',menu:'Хэмжээ',solved:'Зөв боллоо! 🎉',
      rules:'Мөр, баганын тоонууд тэр шугам дээрх дараалсан будсан нүднүүдийн уртыг заана (дараалал нь эхнээсээ). Тоонуудыг ашиглаад нүднүүдийг будаж далд зургийг гарга.',
      tip:'Хуруугаа чирж олон нүд будаж болно. Урт дарвал × тэмдэг тавина.',
      result:'{s} · {t} · {m} алдаа',newBest:'🎉 Шинэ хамгийн хурдан!',lbNote:'Самбар: 10×10-ийн хамгийн бага секунд'},
  en:{title:'Nonogram',time:'Time',size:'Size',mistakes:'Mistakes',fill:'Fill',mark:'Mark',hint:'Hint',start:'Start',next:'Next puzzle',menu:'Size',solved:'Solved! 🎉',
      rules:'The numbers on each row and column tell you the lengths of consecutive filled runs on that line, in order. Use them to deduce which cells to fill and reveal the hidden picture.',
      tip:'Drag to fill multiple cells. Long-press to place an × mark.',
      result:'{s} · {t} · {m} mistakes',newBest:'🎉 New fastest time!',lbNote:'Board: fewest seconds on 10×10'}
});
let N=5,sol=[],grid=[],tool='fill',startT=0,timer=null,mist=0,hints=3,running=false;
function clues(line){const r=[];let c=0;for(const v of line){if(v)c++;else if(c){r.push(c);c=0;}}if(c)r.push(c);return r.length?r:[0];}
function eq(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}
// Generate a random picture with enough structure; ensure every row/col has clues that are non-trivial
function gen(n){
  const density=n<=5?.6:n<=7?.55:.5;
  for(let tries=0;tries<200;tries++){
    const g=[];
    // symmetric-ish blob for nicer pictures half the time
    const sym=Math.random()<.5;
    for(let r=0;r<n;r++){g.push([]);for(let c=0;c<n;c++){let v;if(sym&&c>=Math.ceil(n/2))v=g[r][n-1-c];else v=Math.random()<density?1:0;g[r].push(v);}}
    // smooth: remove isolated pixels
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){let nb=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<n&&cc<n&&g[rr][cc])nb++;});if(g[r][c]&&nb===0)g[r][c]=0;}
    const total=g.flat().reduce((a,b)=>a+b,0);
    if(total<n*n*.35||total>n*n*.75)continue;
    if(g.some(row=>row.every(v=>!v)))continue;
    if([...Array(n).keys()].some(c=>g.every(row=>!row[c])))continue;
    return g;
  }
  return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>(r+c)%2));
}
function rowClues(r){return clues(sol[r]);}
function colClues(c){return clues(sol.map(row=>row[c]));}
function build(){
  const b=$('#board');b.innerHTML='';
  const maxRow=Math.max(...[...Array(N).keys()].map(r=>rowClues(r).length));
  const maxCol=Math.max(...[...Array(N).keys()].map(c=>colClues(c).length));
  const avail=Math.min(window.innerWidth-28,480);
  const cell=Math.floor(avail/(N+maxRow*0.75+0.5));
  const cs=Math.max(22,Math.min(46,cell));const fs=N>=10?11:N>=7?12:14;
  b.style.gridTemplateColumns=`${Math.max(32,maxRow*(fs*0.9+6)+8)}px repeat(${N},${cs}px)`;
  b.style.gridTemplateRows=`${maxCol*(fs+3)+6}px repeat(${N},${cs}px)`;
  b.appendChild(document.createElement('div'));
  for(let c=0;c<N;c++){const d=document.createElement('div');d.className='clue col';d.id='cc'+c;d.style.fontSize=fs+'px';d.innerHTML=colClues(c).map(v=>'<span>'+v+'</span>').join('');b.appendChild(d);}
  for(let r=0;r<N;r++){
    const d=document.createElement('div');d.className='clue row';d.id='rc'+r;d.style.fontSize=fs+'px';d.innerHTML=rowClues(r).map(v=>'<span>'+v+'</span>').join('');b.appendChild(d);
    for(let c=0;c<N;c++){const e=document.createElement('div');e.className='cell';e.dataset.r=r;e.dataset.c=c;e.style.fontSize=cs*0.7+'px';if((c+1)%5===0&&c<N-1)e.classList.add('g5');if((r+1)%5===0&&r<N-1)e.classList.add('g5b');b.appendChild(e);}
  }
  $('#sizeV').textContent=N+'×'+N;
}
function paint(r,c){const e=$(`.cell[data-r="${r}"][data-c="${c}"]`);e.classList.toggle('on',grid[r][c]===1);e.classList.toggle('x',grid[r][c]===2);}
function checkLine(){
  for(let r=0;r<N;r++){const cur=clues(grid[r].map(v=>v===1?1:0));const el=$('#rc'+r);el.classList.toggle('done',eq(cur,rowClues(r)));}
  for(let c=0;c<N;c++){const cur=clues(grid.map(row=>row[c]===1?1:0));const el=$('#cc'+c);el.classList.toggle('done',eq(cur,colClues(c)));}
}
function solved(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if((grid[r][c]===1)!==(sol[r][c]===1))return false;return true;}
let dragVal=null,pressT=null,longFired=false;
function setCell(r,c,val){
  if(!running)return;
  if(grid[r][c]===val)return;
  if(val===1&&sol[r][c]!==1){mist++;$('#mist').textContent=mist;Sfx.bad();haptic(40);const e=$(`.cell[data-r="${r}"][data-c="${c}"]`);e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),260);grid[r][c]=2;paint(r,c);return;}
  grid[r][c]=val;paint(r,c);Sfx.tick();checkLine();
  if(solved())win();
}
function cellAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.classList.contains('cell')?el:null;}
const board=$('#board');
board.addEventListener('pointerdown',e=>{
  const el=cellAt(e.clientX,e.clientY);if(!el)return;e.preventDefault();
  const r=+el.dataset.r,c=+el.dataset.c;longFired=false;
  const want= tool==='fill'?1:2;
  dragVal = grid[r][c]===want?0:want;
  pressT=setTimeout(()=>{longFired=true;dragVal=grid[r][c]===2?0:2;setCell(r,c,dragVal);haptic(20);},420);
  board._start=[r,c];
});
board.addEventListener('pointermove',e=>{
  if(dragVal===null)return;const el=cellAt(e.clientX,e.clientY);if(!el)return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if(board._start&&(r!==board._start[0]||c!==board._start[1])){clearTimeout(pressT);if(!longFired){setCell(board._start[0],board._start[1],dragVal);board._start=null;}}
  if(!board._start)setCell(r,c,dragVal);
});
function up(e){if(dragVal===null)return;clearTimeout(pressT);if(board._start&&!longFired){setCell(board._start[0],board._start[1],dragVal);}board._start=null;dragVal=null;}
board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);
$('#fillBtn').onclick=()=>{tool='fill';$('#fillBtn').classList.add('on');$('#xBtn').classList.remove('on');};
$('#xBtn').onclick=()=>{tool='x';$('#xBtn').classList.add('on');$('#fillBtn').classList.remove('on');};
$('#hintBtn').onclick=()=>{
  if(!running||hints<=0)return;
  const cand=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(sol[r][c]===1&&grid[r][c]!==1)cand.push([r,c]);
  if(!cand.length)return;const [r,c]=cand[rnd(cand.length)];hints--;$('#hintsLeft').textContent=hints;grid[r][c]=1;paint(r,c);checkLine();Sfx.ok();if(solved())win();
};
function start(){
  sol=gen(N);grid=Array.from({length:N},()=>Array(N).fill(0));mist=0;hints=N>=10?5:3;running=true;
  $('#mist').textContent=0;$('#hintsLeft').textContent=hints;$('#sizeBtn').textContent=N+'×'+N;build();checkLine();
  $('#menuOv').hidden=true;$('#endOv').hidden=true;startT=performance.now();
  clearInterval(timer);timer=setInterval(()=>$('#time').textContent=fmtTime((performance.now()-startT)/1000),500);
}
async function win(){
  running=false;clearInterval(timer);const sec=Math.round((performance.now()-startT)/1000);
  const penal=Math.max(1,sec+mist*10+((N>=10?5:3)-hints)*15);
  const bests=(await Store.get('bests'))||{};const key='n'+N;const isBest=!bests[key]||penal<bests[key];if(isBest){bests[key]=penal;Store.set('bests',bests);}
  const pv=$('#preview');pv.innerHTML='';pv.style.gridTemplateColumns=`repeat(${N},14px)`;sol.flat().forEach(v=>{const d=document.createElement('div');d.style.cssText='width:14px;height:14px;border-radius:2px;background:'+(v?'var(--fg)':'var(--card2)');pv.appendChild(d);});
  $('#finalScore').textContent=fmtTime(sec);$('#endMsg').textContent=(isBest?I18N.t('newBest')+' ':'')+I18N.t('result',{s:N+'×'+N,t:fmtTime(sec),m:mist});
  $('#endOv').hidden=false;Sfx.win();haptic([30,50,30]);
  // Leaderboard is "asc" (lower is better). Only 10×10 solves count so times are comparable.
  if(N>=10){await Board.submit(penal,{size:N,seconds:sec,mistakes:mist});}
  const lb=$('#lb');Board.render(lb,v=>fmtTime(v));
  const note=document.createElement('div');note.className='muted';note.style.marginTop='6px';note.textContent=I18N.t('lbNote');lb.appendChild(note);
}
$('#sizeChips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$$('#sizeChips .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');N=+c.dataset.n;Store.set('size',N);};
function openMenu(){$('#endOv').hidden=true;$('#menuOv').hidden=false;}
$('#menuStart').onclick=start;$('#againBtn').onclick=start;$('#menuBtn').onclick=openMenu;$('#sizeBtn').onclick=openMenu;
window.addEventListener('resize',()=>{if(running){build();for(let r=0;r<N;r++)for(let c=0;c<N;c++)paint(r,c);checkLine();}});
bootApp(async ()=>{
  const sz=await Store.get('size');if([5,7,10].includes(+sz)){N=+sz;$$('#sizeChips .chip').forEach(c=>c.classList.toggle('on',+c.dataset.n===N));}
  start();
});
</script>
</body>
</html>
