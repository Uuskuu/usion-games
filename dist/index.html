<!DOCTYPE html>
<html data-game="type-rush">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="usion:leaderboard" content="desc">
<script src="https://usions.com/usion-sdk.js"></script>
<title>Хурдан бичээч · Type Rush</title>
<style>/* ===== Usion mini-app design system — flat black/white, mobile first ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,[contenteditable],.selectable,.selectable *{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}   /* our display:flex rules would otherwise beat the UA [hidden] rule */
:root{
  --bg:#0a0a0a;--fg:#fafafa;--card:#141414;--card2:#1c1c1c;--line:#282828;--line2:#3a3a3a;
  --muted:#7d7d7d;--dim:#4d4d4d;--accent:#fafafa;--accentfg:#0a0a0a;
  --ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--blue:#4d8dff;
  --r:16px;--r-sm:10px;--r-lg:24px;--pad:16px;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ffffff;--fg:#0a0a0a;--card:#f6f6f6;--card2:#eeeeee;--line:#e4e4e4;--line2:#d0d0d0;
  --muted:#6f6f6f;--dim:#b3b3b3;--accent:#0a0a0a;--accentfg:#ffffff;--blue:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
body{
  display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:6px;flex:none;
  padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  border-bottom:1px solid var(--line);
}
.topbar h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{
  display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 9px;
  background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:11px;
  font-size:13px;font-weight:700;cursor:pointer;line-height:1;transition:background .12s,border-color .12s,transform .08s;
}
.tb:active{transform:scale(.93);background:var(--card)}
@media (hover:hover){.tb:hover{background:var(--card);border-color:var(--line2)}}

/* ---- layout ---- */
.wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px;margin:0 auto;
  padding:14px max(14px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));
  overflow:hidden;min-height:0;
}

/* ---- stat tiles ---- */
.stats{display:flex;gap:8px;width:100%;flex:none}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;text-align:center}
.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.stat .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.1}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:var(--accentfg);border:1px solid var(--accent);border-radius:var(--r);
  padding:0 22px;height:48px;font-size:15px;font-weight:700;letter-spacing:-.2px;cursor:pointer;
  min-width:148px;transition:transform .08s,opacity .12s,background .12s;
}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}
@media (hover:hover){.btn.sec:hover{background:var(--card);border-color:var(--line2)}}
.btn.sm{height:40px;padding:0 15px;font-size:14px;min-width:0;border-radius:12px}
.btn:disabled{background:transparent;color:var(--dim);border-color:var(--line);cursor:default;transform:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row .btn{flex:1 1 auto;min-width:120px}

/* ---- overlays & panels ---- */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(6,6,6,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  overflow:auto;animation:fade .16s ease-out;
}
:root[data-theme="light"] .overlay{background:rgba(255,255,255,.82)}
.overlay[hidden]{display:none}
.panel{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:26px 20px 20px;width:100%;max-width:400px;text-align:center;max-height:100%;overflow:auto;
  animation:rise .2s cubic-bezier(.2,.8,.3,1);
}
.panel h2{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
.panel p{color:var(--muted);margin:0 0 16px;line-height:1.5;font-size:14px}
.panel .big{font-size:56px;font-weight:900;margin:2px 0 4px;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;line-height:1}
.panel>.row{margin-top:14px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.chip{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.12s;
}
.chip.on{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
.muted{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.toast{
  position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;
  font-weight:700;font-size:14px;pointer-events:none;animation:pop .15s;z-index:60;box-shadow:var(--shadow);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}

/* ---- leaderboard ---- */
.lb{margin:14px 0 2px;text-align:left}
.lbtabs{display:flex;gap:4px;margin-bottom:8px;background:var(--card);border-radius:11px;padding:3px}
.lbtab{flex:1;background:transparent;border:0;color:var(--muted);border-radius:8px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;transition:.12s}
.lbtab.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow)}
.lblist{max-height:196px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.lblist .muted{padding:16px;text-align:center;display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.lbrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px}
.lbrow:last-child{border-bottom:0}
.lbrow.me{background:var(--card)}
.lbrank{width:18px;color:var(--muted);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.lbav{
  width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;overflow:hidden;flex:none;color:var(--muted);
}
.lbav img{width:100%;height:100%;object-fit:cover}
.lbname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lbscore{font-weight:800;font-variant-numeric:tabular-nums}

/* ---- waiting hall roster ---- */
.roster{display:flex;flex-direction:column;gap:6px;margin:12px 0;text-align:left;max-height:212px;overflow:auto}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s}
.pl.me{border-color:var(--fg)}
.pl.gone{opacity:.4}
.pl .lbav{width:30px;height:30px;font-size:12px}
.plname{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pltag{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;background:var(--card2);border-radius:6px;padding:3px 6px;flex:none}
.plrdy{font-size:13px;font-weight:800;color:var(--dim);flex:none;width:16px;text-align:center}
.plrdy.on{color:var(--ok)}

/* ---- race track ---- */
.track{display:flex;flex-direction:column;gap:7px;width:100%;margin-bottom:12px;flex:none}
.trk{position:relative;display:flex;align-items:center;gap:8px;font-size:12px}
.trk .lbav{width:24px;height:24px;font-size:10px}
.tname{width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.trk.me .tname{color:var(--blue)}
.tbarw{flex:1;height:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tbarw b{display:block;height:100%;width:0;background:var(--muted);border-radius:999px;transition:width .13s linear,background .2s}
.trk.me .tbarw b{background:var(--blue)}
.trk.done .tbarw b{background:var(--ok)}
.trk.gone{opacity:.4}
.twpm{width:44px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.trk.me .twpm{color:var(--fg)}
.bub{
  position:absolute;left:32px;bottom:18px;z-index:5;max-width:74%;
  background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:6px 11px;
  font-size:12px;font-weight:600;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);
  animation:rise .15s ease-out;
}

/* ---- quick chat sheet ---- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,6,6,.6);animation:fade .14s}
.sheet[hidden]{display:none}
.sheetbox{
  background:var(--bg);border:1px solid var(--line);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);
  padding:16px 14px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:520px;
  animation:sheetup .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.phr button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.phr button:active{transform:scale(.96)}
.chatrow{display:flex;gap:6px}
.chatrow input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:0 13px;height:40px;font-size:15px;outline:none}
.chatrow input:focus{border-color:var(--fg)}

/* ---- records ---- */
.recs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0 2px;text-align:left}
.rec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;transition:border-color .2s}
.rec .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.rec .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.6px;margin-top:2px;line-height:1.1}
.rec .s{font-size:10px;color:var(--muted);margin-top:2px;font-weight:700;font-variant-numeric:tabular-nums}
.rec.new{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.rec.new .v{color:var(--ok)}

/* ---- countdown ---- */
.cdown{
  position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;
  background:rgba(6,6,6,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-size:96px;font-weight:900;letter-spacing:-4px;color:var(--fg);
}
:root[data-theme="light"] .cdown{background:rgba(255,255,255,.8)}
.cdown[hidden]{display:none}
.cdown{pointer-events:auto;flex-direction:column;gap:10px}
.cdown>span{animation:count .5s cubic-bezier(.2,.8,.3,1)}
.cdhint{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
@keyframes count{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}

/* ---- lesson list ---- */
.lessons{flex:1;display:flex;flex-direction:column;width:100%;min-height:0}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex:none}
.ltitle{font-size:17px;font-weight:800;letter-spacing:-.3px}
.lsub{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;margin-top:2px}
.chips.lang{margin:0;gap:4px;flex:none}
.chips.lang .chip{padding:6px 11px;font-size:11px}
.llist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.les{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--fg);
  font-family:inherit;font-size:14px;cursor:pointer;
}
.les:active{transform:scale(.99)}
.les.done{border-color:var(--ok)}
.les.free{background:transparent;border-style:dashed}
.lnum{width:24px;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.lname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkeys{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:3px;flex:none}
.lbest{font-size:11px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;flex:none}

/* ---- finger cards ---- */
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;padding-bottom:6px}
.fcard{display:block;width:100%;padding:0;background:transparent;border:0;color:var(--fg);font-family:inherit;text-align:left;cursor:pointer}
.fbox{
  display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:8px;transition:border-color .15s,box-shadow .15s,transform .08s;
}
.fcard:active .fbox{transform:scale(.98)}
.fcard.done .fbox{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.fcard.next .fbox{border-color:var(--line2)}
.fbox.img{padding:0;background:#0b1523;border-color:#1b2a42;overflow:hidden}
.hand{display:block;width:100%;height:auto;border-radius:10px}
img.hand{object-fit:contain}
.fbadge{
  position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;
  background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;
}
.fcard.done .fbadge{background:var(--warn);color:#241700}
.fnum{display:block;margin:8px 0 1px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.fname{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.fkeys{display:block;margin-top:2px;font-size:11px;color:var(--dim);letter-spacing:1.6px;font-weight:700}
.backb{
  width:34px;height:34px;flex:none;background:transparent;border:1px solid var(--line);border-radius:11px;
  color:var(--fg);font-size:18px;font-weight:700;line-height:1;cursor:pointer;
}
.lhand{width:44px;height:44px;flex:none;object-fit:contain}

/* ---- unlock / paywall ---- */
.payrow{display:flex;align-items:center;gap:11px;padding:12px;margin:4px 0 6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.payico{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.paytxt{flex:1;min-width:0}
.paytxt b{display:block;font-size:14px;font-weight:800}
.paytxt span{font-size:12px;color:var(--muted)}
.payprice{font-size:15px;font-weight:800;color:var(--warn);white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;margin-top:12px;padding:4px}
.linkbtn:disabled{opacity:.5}
.paynote{font-size:11px!important;color:var(--muted);margin:12px 0 0!important;line-height:1.4}
.btn.buy{background:var(--warn);border-color:var(--warn);color:#1a1200}
.buybar{
  display:flex;align-items:center;gap:9px;width:100%;margin-bottom:8px;padding:11px 12px;flex:none;
  background:var(--card);border:1px solid var(--warn);border-radius:14px;color:var(--fg);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left;
}
.buybar .bbtxt{flex:1}
.buybar .bbprice{color:var(--warn);font-weight:800}
.les.lock{opacity:.62}
.lfree{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:2px 5px;flex:none}

/* ---- bottom tabs (app shell: stays above the overlays) ---- */
.tabs{
  position:relative;z-index:80;display:flex;gap:6px;flex:none;background:var(--bg);
  border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:transparent;border:0;color:var(--muted);border-radius:14px;padding:7px 4px;
  font-size:11px;font-weight:700;letter-spacing:.2px;cursor:pointer;transition:background .14s,color .14s;
}
.tab.on{background:var(--card);color:var(--blue)}
.tab:active{transform:scale(.97)}
.tab .ti{font-size:19px;line-height:1}
.short .tabs{padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom))}
.short .tab{flex-direction:row;gap:6px;padding:5px 4px;font-size:11px}
.short .tab .ti{font-size:14px}

.play{touch-action:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- race lanes (type-the-track) ---- */
.track{display:flex;flex-direction:column;width:100%;flex:none;margin-bottom:12px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:6px 10px}
.lane{display:flex;align-items:center;gap:8px;height:38px}
.road{position:relative;flex:1;height:100%;border-bottom:1px dashed var(--line2)}
.lane:last-child .road{border-bottom:0}
.road::after{
  content:"";position:absolute;right:0;top:4px;bottom:5px;width:6px;opacity:.55;
  background-image:linear-gradient(45deg,var(--muted) 25%,transparent 25%,transparent 75%,var(--muted) 75%),
                   linear-gradient(45deg,var(--muted) 25%,transparent 25%,transparent 75%,var(--muted) 75%);
  background-size:6px 6px;background-position:0 0,3px 3px;
}
.racer{
  position:absolute;bottom:4px;left:calc(var(--f,0) * (100% - 92px));
  display:flex;align-items:flex-end;gap:4px;transition:left .14s linear;
}
.rname{width:56px;text-align:right;font-size:10px;font-weight:800;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:4px}
.lane.me .rname{color:var(--blue)}
.car{font-size:22px;line-height:1;filter:grayscale(.35)}
.lane.me .car{filter:none}
.lane.done .car{animation:hop .5s ease-out}
.lane.gone{opacity:.35}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.lwpm{width:52px;text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.lane.me .lwpm{color:var(--fg)}
.racer .bub{left:auto;right:0;bottom:30px}
/* ---- typing surface: the text IS the input ---- */
.typebox{
  position:relative;width:100%;flex:1 1 auto;max-height:min(42vh,320px);min-height:0;cursor:text;
  padding:10px 0;overflow:hidden;
}
.text{
  -webkit-user-select:none;user-select:none;white-space:pre-wrap;
  font-size:clamp(19px,5.2vw,25px);line-height:1.6;letter-spacing:.1px;word-break:break-word;
}
.text span{border-radius:3px}
.text .todo{color:var(--dim)}
.text .ok{color:var(--fg)}
.text span{border-radius:0}
.text .w{box-shadow:inset 0 -2px 0 var(--line2)}
.text .bad{color:var(--bad);background:rgba(239,68,68,.18);text-decoration:underline;text-underline-offset:3px}
.text .cur{position:relative;color:var(--dim)}

<script>/* ===== Usion mini-app shared runtime (uses the real window.Usion SDK) =====
 * The SDK is loaded via <script src="https://usions.com/usion-sdk.js"> in <head>.
 * Outside the host (local dev / SDK unreachable) a minimal stub with the SAME
 * method names is installed so the game still runs; every SDK call is wrapped
 * in try/catch because platform writes fail for guests (AUTH_REQUIRED).
 */
(function installStubIfNeeded(){
  if (window.Usion) return;
  const mem = {};
  const noop = () => {};
  const P = v => Promise.resolve(v);
  window.Usion = {
    _stub: true,
    init(cb){ const cfg={userId:'local_dev',userName:'You',theme:'dark',language:(navigator.language||'mn').slice(0,2),mode:'single'}; this.config=cfg; setTimeout(()=>cb&&cb(cfg),0); return P(cfg); },
    config:{}, getLaunchParams(){ return {mode:'single',path:null,roomId:null,ref:null}; },
    getTheme(){ return (this.config&&this.config.theme)||'dark'; }, getLanguage(){ return (this.config&&this.config.language)||'mn'; },
    user:{ getId(){return 'local_dev';}, getName(){return 'You';}, getAvatar(){return null;} },
    storage:{ get(k){return P(mem[k]===undefined?null:mem[k]);}, set(k,v){mem[k]=v;return P({success:true});}, remove(k){delete mem[k];return P({success:true});}, keys(){return P(Object.keys(mem));}, clear(){for(const k in mem)delete mem[k];return P({success:true});} },
    leaderboard:{ submit(s){return P({success:true,score:s,best:s,previous:null,rank:1,updated:true});}, top(){return P([]);}, friends(){return P([{user_id:'local_dev',name:'You',score:0,rank:1,is_me:true}]);}, me(){return P({score:0,rank:1,total:1});} },
    game:{
      connect(){return P(true);}, join(){return P({room_id:null,player_id:'local_dev'});}, leave:noop, disconnect:noop,
      isConnected(){return false;}, isMultiplayer(){return false;},
      action(){return P({success:true});}, realtime(){return P({success:true});}, requestSync:noop,
      invite(){return P({success:false,reason:'offline'});}, reportResult(){return P({success:true});},
      forfeit(){return P({success:true});}, setState(){return P({success:true});},
      saveState(){return false;}, loadState(){return null;}, clearState:noop,
      onJoined:noop, onPlayerJoined:noop, onPlayerLeft:noop, onRoomAssigned:noop, onAction:noop, onRealtime:noop,
      onSync:noop, onError:noop, onDisconnect:noop, onReconnect:noop, onReconnected:noop,
      onConnectionState:noop, onPlayerConnection:noop, onGameFinished:noop, onStateUpdate:noop
    },
    cloud:{ get(k){return P(mem['c:'+k]===undefined?null:mem['c:'+k]);}, set(k,v){mem['c:'+k]=v;return P({success:true});},
      remove(k){delete mem['c:'+k];return P({success:true});}, keys(){return P([]);} },
    wallet:{ getBalance(){return P(0);}, hasCredits(){return P(false);},
      requestPayment(){return P({success:false,reason:'offline'});}, onBalanceChange:noop },
    share:noop, claimBackButton:noop, releaseBackButton:noop, exit:noop, log:noop, setLoading:noop
  };
})();

/* ---- i18n ---- */
const I18N = (() => {
  let lang = 'mn'; const dict = {};
  function t(key, vars) {
    let s = (dict[lang] && dict[lang][key]) || (dict.mn && dict.mn[key]) || key;
    if (vars) for (const k in vars) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
    return s;
  }
  function apply() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.documentElement.lang = lang;
    const b = document.getElementById('langBtn'); if (b) b.textContent = lang === 'mn' ? 'EN' : 'MN';
  }
  function set(l) { lang = l === 'en' ? 'en' : 'mn'; apply(); window.dispatchEvent(new Event('langchange')); }
  function toggle() { set(lang === 'mn' ? 'en' : 'mn'); Store.set('lang', lang); }
  return { t, apply, set, toggle, get lang() { return lang; }, register(d) { for (const l in d) dict[l] = Object.assign(dict[l] || {}, d[l]); } };
})();

/* ---- durable per-user storage ----
 * Three independent tiers: Usion.storage (database-backed), localStorage (survives an
 * instant exit because the write is synchronous) and Usion.cloud (server-side, cross-device).
 * A read takes the first tier that answers and heals the others, so one of them coming back
 * empty after a relaunch can no longer lose a setting.
 */
const Store = {
  prefix: (document.documentElement.dataset.game || 'game') + ':',
  mem: {},
  _call(path, method) {
    const args = Array.prototype.slice.call(arguments, 2);
    try {
      const api = Usion[path];
      if (!api || typeof api[method] !== 'function') return Promise.resolve(null);
      return Promise.resolve(api[method].apply(api, args)).catch(() => null);
    } catch (e) { return Promise.resolve(null); }
  },
  _local(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  _has(v) { return v !== null && v !== undefined; },
  async get(k) {
    const key = this.prefix + k;
    const plat = await this._call('storage', 'get', key);
    const local = this._local(key);
    let cloud = null;
    if (!this._has(plat) && !this._has(local)) cloud = await this._call('cloud', 'get', key);
    const v = this._has(plat) ? plat : this._has(local) ? local : cloud;
    if (!this._has(v)) return this._has(this.mem[k]) ? this.mem[k] : null;
    this.mem[k] = v;
    if (!this._has(plat)) this._call('storage', 'set', key, v);      // heal the tiers that lost it
    if (!this._has(local)) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
    return v;
  },
  set(k, v) {
    const key = this.prefix + k;
    this.mem[k] = v;
    try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
    const write = this._call('storage', 'set', key, v);
    this._call('cloud', 'set', key, v);
    return write.then(r => {
      if (r === null) setTimeout(() => this._call('storage', 'set', key, v), 900);   // one quiet retry
      return r;
    });
  },
  remove(k) {
    const key = this.prefix + k;
    delete this.mem[k];
    try { localStorage.removeItem(key); } catch (e) {}
    this._call('cloud', 'remove', key);
    return this._call('storage', 'remove', key);
  },
};

/* ---- leaderboard: submit + render friends/global boards ---- */
const Board = {
  async submit(score, meta) {
    try { return await Usion.leaderboard.submit(score, meta); } catch (e) { return null; }
  },
  /* the platform IS the record book: {score, rank, total} for this player, null outside the host */
  async me() {
    try { const m = await Usion.leaderboard.me(); return (m && typeof m.score === 'number') ? m : null; } catch (e) { return null; }
  },
  /* container gets a Friends/Global toggle + list. lowerIsBetter only affects formatting. */
  async render(container, fmt) {
    fmt = fmt || (v => v);
    container.innerHTML = '<div class="lbtabs"><button class="lbtab on" data-k="friends">' + I18N.t('lbFriends') + '</button><button class="lbtab" data-k="top">' + I18N.t('lbGlobal') + '</button></div><div class="lblist"><div class="muted">…</div></div>';
    const list = container.querySelector('.lblist');
    const me = (() => { try { return Usion.user.getId(); } catch (e) { return null; } })();
    async function load(k) {
      list.innerHTML = '<div class="muted">…</div>';
      let rows = [];
      try { rows = k === 'friends' ? await Usion.leaderboard.friends({ limit: 10 }) : await Usion.leaderboard.top({ limit: 10 }); } catch (e) { rows = []; }
      if (!rows || !rows.length) { list.innerHTML = '<div class="muted">' + I18N.t('lbEmpty') + '</div>'; return; }
      list.innerHTML = '';
      rows.slice(0, 10).forEach((r, i) => {
        const d = document.createElement('div'); d.className = 'lbrow' + ((r.is_me || r.user_id === me) ? ' me' : '');
        const rank = document.createElement('span'); rank.className = 'lbrank'; rank.textContent = (r.rank || i + 1);
        const av = document.createElement('span'); av.className = 'lbav'; if (r.avatar) { const img = document.createElement('img'); img.src = r.avatar; img.alt = ''; img.draggable = false; av.appendChild(img); } else av.textContent = (r.name || '?').slice(0, 1).toUpperCase();
        const nm = document.createElement('span'); nm.className = 'lbname'; nm.textContent = r.name || I18N.t('lbPlayer');
        const sc = document.createElement('span'); sc.className = 'lbscore'; sc.textContent = fmt(r.score);
        d.append(rank, av, nm, sc); list.appendChild(d);
      });
    }
    container.querySelectorAll('.lbtab').forEach(b => b.onclick = () => { container.querySelectorAll('.lbtab').forEach(x => x.classList.remove('on')); b.classList.add('on'); load(b.dataset.k); });
    load('friends');
  }
};
I18N.register({ mn: { lbFriends: 'Найзууд', lbGlobal: 'Глобал', lbEmpty: 'Одоогоор амжилт алга', lbPlayer: 'Тоглогч' }, en: { lbFriends: 'Friends', lbGlobal: 'Global', lbEmpty: 'No records yet', lbPlayer: 'Player' } });

/* ---- theme ---- */
function applyTheme() { let th = 'dark'; try { th = Usion.getTheme() || 'dark'; } catch (e) {} document.documentElement.dataset.theme = th; }

/* ---- boot: wait for Usion.init, then start instantly (mode 'single' = zero taps) ---- */
function bootApp(onReady) {
  let started = false;
  async function go(cfg) {
    if (started) return; started = true;
    cfg = cfg || Usion.config || {};
    applyTheme();
    let saved = null; try { saved = await Store.get('lang'); } catch (e) {}
    let lang = saved; if (!lang) { try { lang = Usion.getLanguage(); } catch (e) {} } if (!lang) lang = cfg.language || 'mn';
    I18N.set(lang);
    bindTopbar();
    try { Usion.releaseBackButton(); } catch (e) {}
    onReady(cfg);
  }
  try { Usion.init(go); } catch (e) { go({}); }
  setTimeout(() => { if (!started) go(Usion.config || {}); }, 4000); // host silent → still playable
}

/* ---- tiny helpers ---- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function haptic(ms) { try { navigator.vibrate && navigator.vibrate(ms || 15); } catch (e) {} }
function fmtTime(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 800); }

/* ---- WebAudio sfx (no assets) ---- */
const Sfx = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('usion_sfx') !== '0'; } catch (e) {}
  function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ctx; }
  function tone(f, d, type, vol) {
    if (!on) return; const c = ac(); if (!c) return;
    try { const o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.07, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) {}
  }
  return {
    ok() { tone(660, 0.08); setTimeout(() => tone(880, 0.1), 60); },
    bad() { tone(180, 0.18, 'square', 0.05); },
    tick() { tone(1000, 0.03, 'square', 0.03); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.15), i * 90)); },
    toggle() { on = !on; try { localStorage.setItem('usion_sfx', on ? '1' : '0'); } catch (e) {} return on; },
    get on() { return on; }
  };
})();
function bindTopbar() {
  const lb = $('#langBtn'); if (lb) lb.onclick = () => I18N.toggle();
  const sb = $('#sfxBtn'); if (sb) { sb.textContent = Sfx.on ? '🔊' : '🔈'; sb.onclick = () => { sb.textContent = Sfx.toggle() ? '🔊' : '🔈'; }; }
}
/* ---- records: durable personal bests / counters (Usion.storage backed) ---- */
const Records = {
  d: {}, _t: null,
  async load() { this.d = (await Store.get('records')) || {}; return this.d; },
  get(k, dflt) { const v = this.d[k]; return (v === undefined || v === null) ? (dflt === undefined ? 0 : dflt) : v; },
  bump(k, n) { this.d[k] = (this.d[k] || 0) + (n === undefined ? 1 : n); this.save(); return this.d[k]; },
  /* returns {better, prev} — prev is null on a first-ever result */
  best(k, v, lowerIsBetter) {
    const p = this.d[k]; const has = p !== undefined && p !== null;
    const better = !has || (lowerIsBetter ? v < p : v > p);
    if (better) { this.d[k] = v; this.save(); }
    return { better, prev: has ? p : null };
  },
  save() { clearTimeout(this._t); this._t = setTimeout(() => Store.set('records', this.d), 120); }
};

/* The platform's launch-mode split: 'single' => instant play, 'multiplayer' => waiting hall.
   Decided from the MODE, never from roomId (a solo launch can carry a standalone_* room). */
function launchedSolo(config) {
  try {
    const lp = (window.Usion && Usion.getLaunchParams && Usion.getLaunchParams()) || {};
    if (lp.mode === 'single') return true;
    if (lp.mode === 'multiplayer') return false;
    if (Usion.game && typeof Usion.game.isMultiplayer === 'function') return !Usion.game.isMultiplayer();
    const rid = config && config.roomId ? String(config.roomId) : '';
    return !rid || /^standalone[_-]/i.test(rid);
  } catch (e) { return false; }
}

/* ---- roster: who is in the room, their info and ready state ---- */
const Roster = {
  ids: [], myId: null, info: {}, present: {},
  reset(ids, myId) {
    this.myId = myId || this.myId;
    this.ids = (ids || []).slice();
    if (this.myId && this.ids.indexOf(this.myId) < 0) this.ids.push(this.myId);
    this.info = {}; this.present = {};
    if (this.myId) this.see(this.myId);
    return this;
  },
  /* adopt the platform roster verbatim — ids[0] is the host — keeping known info */
  setIds(ids) {
    if (!ids || !ids.length) return this;
    this.ids = ids.slice();
    if (this.myId && this.ids.indexOf(this.myId) < 0) this.ids.push(this.myId);
    this.ids.forEach(id => { if (this.present[id] === undefined) this.present[id] = true; });
    return this;
  },
  hostId() { return this.ids[0] || null; },
  isHost() { return !!this.myId && this.hostId() === this.myId; },
  see(id) { if (!id) return; if (this.ids.indexOf(id) < 0) this.ids.push(id); this.present[id] = true; if (this.info[id]) this.info[id].gone = false; },
  gone(id) { this.present[id] = false; if (this.info[id]) this.info[id].gone = true; },
  drop(id) { delete this.present[id]; const i = this.ids.indexOf(id); if (i >= 0) this.ids.splice(i, 1); delete this.info[id]; },
  set(id, patch) { this.info[id] = Object.assign({ name: '', avatar: null, ready: false, bot: false, gone: false }, this.info[id], patch); return this.info[id]; },
  of(id) { return this.info[id] || { name: '', avatar: null, ready: false, bot: false, gone: false }; },
  name(id) { const n = this.of(id).name; return n || (id === this.myId ? I18N.t('lbPlayer') : I18N.t('lbPlayer')); },
  here() { return this.ids.filter(id => this.present[id] !== false); },
  allReady() { const h = this.here(); return h.length >= 2 && h.every(id => this.of(id).ready); }
};

/* avatar bubble (image or initial) shared by the roster, the race track and the boards */
function avatarEl(info, cls) {
  const av = document.createElement('span'); av.className = cls || 'lbav';
  if (info && info.avatar) { const img = document.createElement('img'); img.src = info.avatar; img.alt = ''; img.draggable = false; av.appendChild(img); }
  else av.textContent = ((info && info.name) || '?').slice(0, 1).toUpperCase();
  return av;
}

/* ---- in-game quick chat (rides the room relay, never Usion.chat) ---- */
const Chat = {
  MAX: 60, _last: 0, render: null,
  norm(v) { if (typeof v !== 'string') return ''; const m = v.trim().replace(/\s+/g, ' '); return (m && m.length <= this.MAX) ? m : m.slice(0, this.MAX); },
  send(v) {
    const phrase = this.norm(v); if (!phrase) return false;
    if (Date.now() - this._last < 700) return false;
    this._last = Date.now();
    if (this.render) this.render(Roster.myId, phrase);
    try { Usion.game.realtime('quick_chat', { phrase }); } catch (e) {}
    return true;
  },
  receive(m) {
    if (!m || m.action_type !== 'quick_chat' || m.player_id === Roster.myId) return;
    const phrase = this.norm(m.action_data && m.action_data.phrase);
    if (phrase && this.render) this.render(m.player_id, phrase);
  }
};

document.addEventListener('touchmove', e => { if (e.target.closest && e.target.closest('.play')) e.preventDefault(); }, { passive: false });

const SKIN='#f7d7bd',SKIN2='#f0c7a6',NAIL='#fff1e4',HOT='#f5a623';
const FPOS={index:0,middle:1,ring:2,pinky:3};
/* An open hand seen from the back, thumb on the left; the drilled finger is filled orange.
   The right hand is the same drawing mirrored. */
function handBody(hand,finger){
  const pos=FPOS[finger];
  const F=[{x:29,top:23,w:12},{x:42,top:15,w:12},{x:55,top:21,w:12},{x:68,top:33,w:11}];
  let g='<rect x="25" y="40" width="58" height="52" rx="17" fill="'+SKIN2+'"/>'+
        '<g transform="rotate(38 27 58)"><rect x="20" y="54" width="12" height="34" rx="6" fill="'+SKIN+'"/>'+
        '<rect x="22.5" y="57" width="7" height="9" rx="3.5" fill="'+NAIL+'"/></g>';
  F.forEach((f,i)=>{
    const on=i===pos;
    g+='<rect x="'+f.x+'" y="'+f.top+'" width="'+f.w+'" height="'+(66-f.top)+'" rx="'+(f.w/2)+'" fill="'+(on?HOT:SKIN)+'"/>';

  });
  return hand==='r'?'<g transform="translate(108,0) scale(-1,1)">'+g+'</g>':g;
}

function handSvg(hand,finger){

      out.push({id:g.id+'_'+kind,k:kind,g:grp,keys:ks.slice(),pool:learned.slice(),caps:false});
    });
    out.push({id:g.id+'_caps',k:'caps',g:grp,keys:letters.slice(),pool:letters.slice(),caps:true});
    learned=learned.concat(g.rows.num);
    out.push({id:g.id+'_rev',k:'rev',g:grp,keys:all.slice(),pool:learned.slice(),caps:false});
    grp.count=out.length-grp.from;
    groups.push(grp);
  });
  const last={id:'text',k:'txt',g:null,keys:[],pool:[],caps:false};
  out.push(last);
  GROUPS=groups;
  return out;
}

/* nonsense syllables built from the keys this lesson drills, weighted to the new ones */
function drillLine(l){
  const words=[];
  for(let w=0;w<11;w++){
    let s='';
    const len=2+rnd(3);
    for(let k=0;k<len;k++){
      const src=(Math.random()<0.66?l.keys:l.pool);
      let ch=src[rnd(src.length)];
      if(l.caps&&Math.random()<0.5)ch=ch.toUpperCase();
      s+=ch;
    }
    words.push(s);
  }
  return [words.join(' '),'—'];
}
function lessonQueue(l){
  if(l.k==='txt')return pickFresh(tl,2,2);
  return [drillLine(l),drillLine(l),drillLine(l)];
}

/* ---------- sentence picking ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function poolOf(lang,level){ return (TEXTS[lang]&&TEXTS[lang][level])||TEXTS.mn[1]; }
/* multiplayer: everybody derives the same five from the host's seed */
/* multiplayer: everybody derives the same round from the host's seed */
function seededQueue(seed,lang,mix){
  const r=mulberry32(seed>>>0),used={},out=[];
  (mix||MIX).forEach(level=>{
    const pool=poolOf(lang,level),taken=used[level]||(used[level]=[]);
    let i,guard=0;
    do{ i=Math.floor(r()*pool.length); }while(taken.indexOf(i)>=0&&++guard<40);
    taken.push(i);out.push(pool[i]);
  });
  return out;
}
/* solo: prefer sentences this player has not seen lately, so rounds keep feeling new */
/* solo: prefer sentences this player has not seen lately, so rounds keep feeling new */
function pickFresh(lang,level,n){
  const pool=poolOf(lang,level),key='seen'+lang+level;
  let seen=Records.get(key,[]);
  if(!Array.isArray(seen))seen=[];
  let idxs=pool.map((_,i)=>i).filter(i=>seen.indexOf(i)<0);
  if(idxs.length<n){ seen=[];idxs=pool.map((_,i)=>i); }
  shuffle(idxs);
  const pick=idxs.slice(0,n);
  Records.d[key]=seen.concat(pick).slice(-Math.max(n,pool.length-n));
  Records.save();
  return pick.map(i=>pool[i]);
}
function freshQueue(lang,mix){
  const need={};
  (mix||MIX).forEach(l=>{ need[l]=(need[l]||0)+1; });
  const bank={};
  for(const l in need)bank[l]=pickFresh(lang,+l,need[l]);
  return (mix||MIX).map(l=>bank[l].shift());
}

/* ---------- typing round ---------- */
/* A lesson exists to teach Shift, so there case must match exactly. Everywhere else a phone
   keyboard makes Shift expensive enough that a case-only difference is not a typing mistake. */
function strictCase(){ return R.drill&&R.lesson>=0; }
function eq(a,b){
  if(a===b)return true;
  if(strictCase()||a==null||b==null)return false;
  return String(a).toLowerCase()===String(b).toLowerCase();
}
function esc(ch){ return ch==='&'?'&amp;':(ch==='<'?'&lt;':(ch==='>'?'&gt;':ch)); }
function render(){
  const val=inp.value,el=$('#text');
  const at=Math.min(val.length,target.length);
  const ws=target.lastIndexOf(' ',Math.max(0,at-1))+1;         // current word, typeracer style
  let we=target.indexOf(' ',at); if(we<0)we=target.length;
  let html='';
  for(let i=0;i<target.length;i++){
    const ch=target[i];
    let cls=i<val.length?(eq(val[i],ch)?'ok':'bad'):(i===val.length?'cur':'todo');
    if(i>=ws&&i<we)cls+=' w';
    html+='<span class="'+cls+'">'+esc(ch)+'</span>';
  }
  el.innerHTML=html;
}

/* the sentence must always be fully readable, whatever room the keyboard left us */
function fitText(){
  const el=$('#text'),cs=getComputedStyle(box);
  const avail=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(avail<=0)return;
  el.style.fontSize='';
  let size=parseFloat(getComputedStyle(el).fontSize),guard=0;
  while(el.offsetHeight>avail&&size>12&&guard++<20){ size-=1;el.style.fontSize=size+'px'; }
}

function stats(){

    Usion.game.onJoined(d=>{ if(d&&d.player_ids)Roster.setIds(d.player_ids); Roster.see(Roster.myId); shareInfo(); });
    Usion.game.onPlayerJoined(d=>{
      if(!d)return;

      shareInfo();
    });

      if(!d||!d.player_id)return;

      Roster.gone(id);

      setTimeout(()=>{ if(Roster.present[id]===false&&phase==='hall'){Roster.drop(id);paintHall();} },20000);  // forfeit grace
      paintHall();paintTrack();
      if(phase==='race'&&isHost())checkRaceEnd();
    });
    Usion.game.onRoomAssigned(d=>{ openHall(d&&d.roomId); });
    Usion.game.onAction(m=>{ if(m&&m.action_type==='race_start')applyRaceStart(m.action_data); });
    Usion.game.onRealtime(onRealtime);
    Usion.game.onSync(d=>{
      if(!d||!d.actions)return;
      for(let i=d.actions.length-1;i>=0;i--){ const a=d.actions[i]; if(a&&a.action_type==='race_start'){applyRaceStart(a.action_data);break;} }
    });

      const down=(s==='disconnected'||s==='rejoining');

      if(running)inp.disabled=down;
      if(!down){ shareInfo(); try{Usion.game.requestSync();}catch(e){} }
    });

  }catch(e){}
}
function onRealtime(m){
  if(!m)return;
  const id=m.player_id,d=m.action_data||{};
  if(m.action_type==='player_info'){
    if(id===Roster.myId)return;
    Roster.see(id);
    Roster.set(id,{name:String(d.name||'').slice(0,24),avatar:d.avatar||null,ready:!!d.ready});
    if(id===Roster.hostId()&&(d.tl==='en'||d.tl==='mn')&&d.tl!==tl){ tl=d.tl;LESSONS=buildLessons(tl); }
    paintHall();
    if(isHost())rt('player_info',myInfo());          // late joiner missed everyone's earlier info
    return;
  }
  if(m.action_type==='quick_chat'){ Chat.receive(m); return; }
  if(m.action_type==='rush'){ if(!isHost()&&phase==='race')toast(I18N.t('rush',{n:GRACE})); return; }
  if(m.action_type==='prog'){
    if(!isHost()||id===Roster.myId)return;
    const p=R.prog[id]||(R.prog[id]={});
    p.f=Math.max(p.f||0,Math.min(1,+d.f||0));
    p.w=Math.min(MAXW,Math.max(0,Math.round(+d.w||0)));
    p.s=Math.max(0,Math.round(+d.s||0));
    if(d.d&&!p.d){ p.d=1;p.ms=performance.now()-startT; }
    return;
  }
  if(m.action_type==='state'){
    if(isHost())return;
    R.hostT=+d.t;R.hostTAt=Date.now();
    (d.p||[]).forEach((row,k)=>{
      const sid=R.seats[k];
      if(!sid||sid===Roster.myId||!row)return;
      R.prog[sid]={f:row[0]/1000,w:row[1],s:row[2],d:row[3],gone:!!row[4]};
    });
    paintTrack();
    return;
  }
  if(m.action_type==='gameover'&&!isHost()){ showRaceEnd(d.st||[],d.win); }
}

/* ---------- waiting hall (the room the chat invite leads to) ---------- */

function updateChatBtn(){ $('#chatBtn').hidden=humansHere().length<2; }

/* ---------- race start / loops ---------- */
function hostStart(withBots){
  const seats=humansHere().slice(),bots=[];
  if(withBots){
    shuffle(BOTS.slice()).slice(0,Math.max(1,3-seats.length)).forEach((b,i)=>{
      const id='bot'+(i+1);bots.push({id,name:b[0],wpm:b[1]});seats.push(id);
    });
  }
  if(seats.length<2)return toast(I18N.t('needTwo'));
  const d={seed:(Date.now()^Math.floor(Math.random()*1e9))>>>0,seats,bots,tl,limit:LIMIT,mix:MIX};
  act('race_start',d);          // sequenced + stored: rejoins rebuild the race from it
  applyRaceStart(d);
}
function applyRaceStart(d){
  if(!d||!d.seats||!d.seats.length)return;
  if(d.seed&&(R.pending===d.seed||(R.seed===d.seed&&phase==='race')))return;   // idempotent: own echo / resync
  R.pending=d.seed;
  stopNetLoops();clearInterval(timer);
  R.seats=d.seats.slice();R.prog={};R.bots={};
  (d.bots||[]).forEach(b=>{
    Roster.set(b.id,{name:b.name,bot:true});Roster.present[b.id]=true;
    R.bots[b.id]={wpm:b.wpm,chars:0,i:0,score:0,done:false,ms:0};
  });
  R.seats.forEach(id=>{ R.prog[id]={f:0,w:0,s:0,d:0,gone:false}; });
  if(d.tl==='en'||d.tl==='mn'){ tl=d.tl;LESSONS=buildLessons(tl); }
  hideOverlays();
  countdown(()=>{
    startRound({queue:seededQueue(d.seed,tl,d.mix),limit:d.limit||LIMIT,mix:d.mix,tl,seed:d.seed,mp:true});
    R.sendT=setInterval(sendMine,100);
    paintTrack();updateChatBtn();
  });
}
function countdown(done){
  const el=$('#cdown');let n=3;
  const show=v=>{
    const sp=document.createElement('span');sp.textContent=v;
    const h=document.createElement('b');h.className='cdhint';h.textContent=I18N.t('tapHint');
    el.replaceChildren(sp,h);
  };
  el.hidden=false;show(n);Sfx.tick();
  const t=setInterval(()=>{
    n--;
    if(n<=0){ show(I18N.t('go'));Sfx.ok();clearInterval(t);setTimeout(()=>{el.hidden=true;done();},450); }
    else{ show(n);Sfx.tick(); }
  },700);
}
function sendMine(){
  const s=stats(),p=R.prog[Roster.myId]||(R.prog[Roster.myId]={});
  p.f=Math.max(p.f||0,myFrac());p.w=s.wpm;p.s=score;p.d=idx>=R.sents?1:0;
  if(!isHost())rt('prog',{f:+p.f.toFixed(3),w:s.wpm,s:score,d:p.d});
}
/* one 15 Hz loop: steps the pace cars, and on the host broadcasts the whole field */
function tick(){
  const now=performance.now(),dt=Math.min(0.25,(now-(tick._t||now))/1000);
  tick._t=now;
  for(const id in R.bots)stepBot(id,dt);
  if(R.mp&&isHost()){
    const rows=R.seats.map(id=>{ const p=R.prog[id]||{}; return[Math.round((p.f||0)*1000),Math.round(p.w||0),Math.round(p.s||0),p.d?1:0,p.gone?1:0]; });
    rt('state',{t:+Math.max(0,timeLeft).toFixed(1),p:rows});
  }
  paintTrack();
  if(R.mp&&isHost())checkRaceEnd();
}
function stepBot(id,dt){
  const b=R.bots[id],p=R.prog[id];
  if(!b||!p||b.done)return;
  b.chars+=b.wpm*5/60*dt*(0.88+Math.random()*0.24);
  const total=R.cum[R.cum.length-1]||1;
  while(b.i<R.sents&&b.chars>=R.cum[b.i+1]){ b.score+=Math.round(queue[b.i][0].length*(1+Math.max(0,timeLeft)/R.limit)); b.i++; }
  if(b.i>=R.sents&&!b.done){ b.done=true;b.ms=performance.now()-startT; }
  p.f=Math.min(1,b.chars/total);p.w=b.wpm;p.s=b.score;p.d=b.done?1:0;
}
function finishMine(){
  running=false;inp.disabled=true;
  const s=stats(),p=R.prog[Roster.myId]||(R.prog[Roster.myId]={});
  p.f=1;p.w=s.wpm;p.s=score;p.d=1;p.ms=performance.now()-startT;
  $('#prog').textContent=I18N.t('waitOthers');
  rt('prog',{f:1,w:s.wpm,s:score,d:1});
  paintTrack();
  if(isHost())checkRaceEnd();
}
function checkRaceEnd(){
  if(R.ended||phase!=='race')return;
  const live=R.seats.filter(id=>!(R.prog[id]||{}).gone);
  // the first player over the line starts the finishing countdown for everyone else
  if(live.some(id=>(R.prog[id]||{}).d)&&timeLeft>GRACE){ timeLeft=GRACE;rt('rush',{});toast(I18N.t('rush',{n:GRACE})); }
  if(!live.length||live.every(id=>(R.prog[id]||{}).d)||timeLeft<=0)endRace(true);
}
function buildStandings(){
  return R.seats.map(id=>{
    const p=R.prog[id]||{};
    return {id,n:Roster.of(id).name||I18N.t('lbPlayer'),b:!!Roster.of(id).bot,
            s:Math.round(p.s||0),w:Math.round(p.w||0),d:p.d?1:0,ms:p.ms||9e9};
  }).sort((a,b)=>b.s-a.s||a.ms-b.ms);
}
function endRace(done){
  if(R.ended)return;
  if(!R.mp){ end(!!done); return; }               // solo round
  if(!isHost())return;                            // the host decides the winner, never a peer
  R.ended=true;
  const st=buildStandings(),win=st.length?st[0].id:null;
  rt('gameover',{st,win});
  const humans=st.filter(x=>!x.b);
  if(humans.length>=2){
    const scores={};humans.forEach(x=>{scores[x.id]=x.s;});
    const ids=humans.map(x=>x.id);
    try{ Usion.game.reportResult({winnerId:ids.indexOf(win)>=0?win:ids[0],standings:ids,scores,metric:'score'}); }catch(e){}
  }
  showRaceEnd(st,win);
}

/* ---------- records + end screens ---------- */
/* Usion.leaderboard is the record book: it holds the score record and the rank,
   and it is what Game Center and the "friend beat your record" notifications read.
   Records (storage) keeps only what one number can't: WPM, accuracy, races, wins. */
/* The practice course is a one-off unlock. Money moves ONLY through the platform wallet;
   the receipt is an escrow hold, so it is settled right away (instant delivery). */
const PRICE=1000,FREE_LESSONS=1;
let pro=false,wantLesson=null;
function lessonLocked(i){ return !pro&&i>=FREE_LESSONS; }
function payKey(){ return 'typerush-course-'+(Roster.myId||'me'); }
/* Never let this block the unlock: it is a background capture with its own timeout,
   and an unsettled token is retried from storage on the next launch. */
async function settleReceipt(token){
  if(!token)return false;
  let timer=null;
  try{
    const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    if(ctl)timer=setTimeout(()=>{try{ctl.abort();}catch(e){}},8000);
    const r=await fetch('https://mobile.mongolai.mn/wallet/receipt/settle',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({receipt_token:token}),signal:ctl?ctl.signal:undefined
    });
    return r.ok;
  }catch(e){ return false; }
  finally{ clearTimeout(timer); }
}
function captureReceipt(token){
  if(!token)return;
  Store.set('receipt',token);
  settleReceipt(token).then(done=>{ if(done)Store.remove('receipt'); });
}
async function loadPro(){
  const pending=await Store.get('receipt');
  pro=!!(await Store.get('pro'))||!!pending;   // charged but the flag never stuck -> still unlocked
  if(pending){ if(pro)Store.set('pro',1); captureReceipt(pending); }
}
function openPay(i){
  wantLesson=(i===undefined?null:i);
  $('#payCount').textContent=I18N.t('payCount',{n:LESSONS.length});
  $('#payPrice').textContent=PRICE+'₮';
  $('#payGo').textContent=I18N.t('payGo',{p:PRICE});
  $('#payGo').disabled=false;
  $('#payOv').hidden=false;
}
/* The user has been charged — hand the goods over first, capture the money after. */
function grantPro(token){
  pro=true;Store.set('pro',1);
  captureReceipt(token);
  $('#payOv').hidden=true;Sfx.win();toast(I18N.t('payOk'));
  const go=wantLesson;wantLesson=null;
  showLessons();
  if(go!==null){ forceKeyboard();startLesson(go); }
}
/* A host may resolve with {success:true} or just with the receipt — both mean paid. */
function paid(r){ return !!r&&r.success!==false&&(r.success===true||!!r.receiptToken||!!r.transactionId); }
async function requestUnlock(){
  try{ return await Usion.wallet.requestPayment(PRICE,I18N.t('payReason'),{idempotencyKey:payKey()}); }
  catch(e){ return null; }
}
async function buyPro(){
  const btn=$('#payGo');
  btn.disabled=true;
  const r=await requestUnlock();
  btn.disabled=false;
  if(!paid(r))return toast(I18N.t('payFail')+(r&&r.reason?': '+r.reason:''));
  grantPro(r&&r.receiptToken);
}
/* Already paid but still locked (a lost reply, a reinstall): the idempotency key makes the
   platform return the SAME receipt without charging again. */
async function restorePro(){
  const b=$('#payRestore');
  b.disabled=true;b.textContent=I18N.t('payChecking');
  const r=await requestUnlock();
  b.disabled=false;b.textContent=I18N.t('payRestore');
  if(!paid(r))return toast(I18N.t('payNoBuy'));
  grantPro(r&&r.receiptToken);
}

let lbMe={score:null,rank:null,total:null};
function bestScore(){ return Math.max(Records.get('best'),lbMe.score||0); }
async function refreshMe(){
  const m=await Board.me();
  if(!m)return;
  lbMe=m;
  if(typeof m.score==='number'&&m.score>Records.get('best'))Records.best('best',m.score);
}
function recRows(hl){
  hl=hl||{};
  const rank=lbMe.rank?'#'+lbMe.rank+(lbMe.total?' / '+lbMe.total:''):'';
  return [['recBest',bestScore(),'best',rank],['recWpm',Records.get('wpm'),'wpm',''],
          ['recAcc',Records.get('acc')+'%','acc',''],['recSents',Records.get('sents'),'sents',''],
          ['recRaces',Records.get('races'),'races',''],['recWins',Records.get('wins'),'wins','']]
    .map(r=>'<div class="rec'+(hl[r[2]]?' new':'')+'"><div class="l">'+I18N.t(r[0])+'</div><div class="v">'+r[1]+'</div>'+
            (r[3]?'<div class="s">'+r[3]+'</div>':'')+'</div>').join('');
}
/* submit, then let the server's answer (best + rank) be what the panel shows */
async function submitScore(meta,el,hl){
  const r=await Board.submit(score,meta);
  if(r){
    if(typeof r.best==='number'){ if(r.best>Records.get('best'))Records.best('best',r.best); lbMe.score=r.best; }
    if(typeof r.rank==='number')lbMe.rank=r.rank;
  }
  if(!lbMe.rank)await refreshMe();
  if(el)el.innerHTML=recRows(hl);   // keep the new-record highlight after the server answers
  return r;
}
function saveRecords(s,wpm,acc,won,mp){
  const hl={};
  if(s>0&&Records.best('best',s).better)hl.best=1;
  if(wpm>0&&Records.best('wpm',wpm).better)hl.wpm=1;
  if(typedChars>=20&&Records.best('acc',acc).better)hl.acc=1;
  if(finished)Records.bump('sents',finished);
  if(mp){ Records.bump('races'); if(won){hl.wins=1;Records.bump('wins');} }
  best=bestScore();
  return hl;
}
async function end(done){
  clearInterval(timer);stopNetLoops();running=false;inp.disabled=true;inp.blur();phase='end';
  const s=stats(),hl=saveRecords(score,s.wpm,s.acc,false,false);
  $('#endTitle').textContent=done?I18N.t('done'):I18N.t('timeUp');
  $('#finalScore').textContent=score;
  $('#endMsg').textContent=(hl.best&&score>0?I18N.t('newBest')+' ':'')+I18N.t('result',{w:s.wpm,a:s.acc,n:finished,t:R.sents});
  $('#standings').hidden=true;
  $('#endRecs').innerHTML=recRows(hl);
  $('#againBtn').textContent=I18N.t('again');
  $('#endOv').hidden=false;Sfx.win();
  await submitScore({wpm:s.wpm,accuracy:s.acc,textLang:tl,sentences:finished,mode:'solo'},$('#endRecs'),hl);
  Board.render($('#lb'));
}
async function showRaceEnd(st,win){
  if(phase==='end')return;
  clearInterval(timer);stopNetLoops();running=false;inp.disabled=true;inp.blur();
  phase='end';R.ended=true;
  st=st&&st.length?st:buildStandings();
  const s=stats(),won=!!win&&win===Roster.myId;
  let place=1;st.forEach((x,i)=>{ if(x.id===Roster.myId)place=i+1; });
  const hl=saveRecords(score,s.wpm,s.acc,won,true);
  $('#endTitle').textContent=won?I18N.t('won'):I18N.t('placeN',{p:place});
  $('#finalScore').textContent=score;
  $('#endMsg').textContent=(hl.best&&score>0?I18N.t('newBest')+' ':'')+I18N.t('mpResult',{w:s.wpm,a:s.acc,n:score});
  const sl=$('#standings');sl.innerHTML='';sl.hidden=false;
  st.forEach((x,i)=>{
    const row=document.createElement('div');row.className='pl'+(x.id===Roster.myId?' me':'');
    const rk=document.createElement('span');rk.className='lbrank';rk.textContent=i+1;row.appendChild(rk);
    row.appendChild(avatarEl(Roster.of(x.id)));
    const nm=document.createElement('span');nm.className='plname';nm.textContent=x.n;row.appendChild(nm);
    if(x.b){ const t=document.createElement('span');t.className='pltag';t.textContent=I18N.t('tagBot');row.appendChild(t); }
    const sc=document.createElement('span');sc.className='lbscore';sc.textContent=x.s+' · '+x.w;row.appendChild(sc);
    sl.appendChild(row);
  });
  $('#endRecs').innerHTML=recRows(hl);
  $('#againBtn').textContent=I18N.t('backHall');
  $('#endOv').hidden=false;
  won?Sfx.win():Sfx.ok();
  await submitScore({wpm:s.wpm,accuracy:s.acc,textLang:tl,sentences:finished,mode:'race',place},$('#endRecs'),hl);
  Board.render($('#lb'));
}

/* ---------- race lanes ---------- */
function paintTrack(){
  if(paintQ||!R.seats.length)return;
  paintQ=true;
  requestAnimationFrame(()=>{
    paintQ=false;
    const el=$('#track');
    if(!el||el.hidden)return;
    if(el.childElementCount!==R.seats.length){
      el.innerHTML='';
      R.seats.forEach((id,k)=>{
        const lane=document.createElement('div');
        lane.className='lane'+(id===Roster.myId?' me':'');lane.dataset.id=id;
        const road=document.createElement('div');road.className='road';
        const racer=document.createElement('div');racer.className='racer';
        const nm=document.createElement('span');nm.className='rname';nm.textContent=Roster.of(id).name||I18N.t('lbPlayer');
        const car=document.createElement('span');car.className='car';
        car.textContent=id==='ghost'?'👻':CARS[k%CARS.length];
        racer.append(nm,car);road.appendChild(racer);
        const w=document.createElement('span');w.className='lwpm';
        lane.append(road,w);el.appendChild(lane);
      });
    }
    R.seats.forEach((id,k)=>{
      const lane=el.children[k];if(!lane)return;
      const mine=id===Roster.myId;
      const p=mine?{f:myFrac(),w:+$('#wpm').textContent||0,d:idx>=R.sents?1:0}:(R.prog[id]||{});
      lane.querySelector('.racer').style.setProperty('--f',Math.min(1,p.f||0));
      lane.querySelector('.lwpm').textContent=p.gone?'—':Math.round(p.w||0);
      lane.classList.toggle('done',!!p.d);
      lane.classList.toggle('gone',!!p.gone);
    });
  });
}
Chat.render=function(id,phrase){

$('#payGo').onclick=buyPro;
$('#payRestore').onclick=restorePro;
$('#lesBack').onclick=()=>{ $('#lesOv').hidden=true;backToLessonList(); };
$('#lesUp').onclick=showLessons;
$('#lesNext').onclick=()=>{
  const next=R.lesson+1<LESSONS.length?R.lesson+1:R.lesson;
  $('#lesOv').hidden=true;
  if(lessonLocked(next))return openPay(next);
  forceKeyboard();startLesson(next);
};
$('#chatBtn').onclick=openChat;
$('#chatSheet').onclick=e=>{ if(e.target.id==='chatSheet'){$('#chatSheet').hidden=true;focusInput();} };
$('#chatSend').onclick=()=>{ if(Chat.send($('#chatInp').value)){ $('#chatInp').value='';$('#chatSheet').hidden=true;focusInput(); } };
$('#chatInp').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#chatSend').click(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')$('#chatSheet').hidden=true; });
window.addEventListener('langchange',()=>{
  setTextLang(I18N.lang);          // one control: the top bar toggle drives everything
  if(phase==='hall')paintHall();
  if(!$('#lessons').hidden)lessonScreen();
  if(queue.length&&idx<queue.length&&running)load();
  if(!$('#recOv').hidden)$('#recGrid').innerHTML=recRows(null);
});

/* The system pans the whole window to reveal a focused field, which shoves the track and the
   clock off screen. Sizing the page to the VISUAL viewport instead keeps everything above the
   keyboard, so nothing has to be panned. */
function fitViewport(){
  const vv=window.visualViewport;
  const h=vv?Math.round(vv.height):window.innerHeight;
  if(h>120)document.body.style.height=h+'px';
  document.documentElement.classList.toggle('short',h<560);
  try{ window.scrollTo(0,0); }catch(e){}
  if(queue.length)requestAnimationFrame(fitText);
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',fitViewport);
  window.visualViewport.addEventListener('scroll',fitViewport);
}
window.addEventListener('resize',fitViewport);
window.addEventListener('orientationchange',()=>setTimeout(fitViewport,250));
fitViewport();

/* ---------- boot ---------- */
bootApp(async (cfg)=>{
  cfg=cfg||{};
  try{ Roster.myId=Usion.user.getId()||'local_dev'; }catch(e){ Roster.myId='local_dev'; }
  await Records.load();
  await loadPro();
  best=Records.get('best');
  refreshMe().then(()=>{ best=bestScore(); });   // non-blocking: never delay instant play
  tl=I18N.lang;
  const tb=await Store.get('tab');if(tb==='drill'||tb==='race')tab=tb;
  LESSONS=buildLessons(tl);
  paintTabs();
  Roster.reset(cfg.playerIds&&cfg.playerIds.length?cfg.playerIds:[Roster.myId],Roster.myId);
  Roster.set(Roster.myId,myInfo());
  fitViewport();
  wireNet();                                                    // up front: a solo round can be promoted
  if(!launchedSolo(cfg)&&cfg.roomId)openHall(cfg.roomId);       // chat invite → waiting hall
  else startCurrent();                                          // GameTok / Explore → instant play
});
</script>
